spring.ldap.embedded.ldif=classpath:user-server.ldif
spring.ldap.embedded.base-dn=dc=springframework,dc=org
spring.ldap.embedded.port=8389
server.servlet.context-path=/ssws
server.port=8080
#logging.level.org.springframework=INFO
logging.level.org.springframework=INFO
logging.level.programmer.bonn.play.springbootlog=DEBUG
logging.level.root=INFO
#server.error.include-stacktrace=never
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

## JWT Properties
app.jwtSecret = ${SSK_JWT_SECRET}
#7days
app.jwtExpirationInMs = 604800000
app.jwtSecret_rpi = ${SSK_JWT_SECRET_RPI}
#1Day
app.jwtExpirationInMs_rpi = 86400000 

## workaround fix for
#org.h2.jdbc.JdbcSQLIntegrityConstraintViolationException: NULL not allowed for column
hibernate.dialect=org.hibernate.dialect.H2Dialect

## H2 Database Configuration for Development
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2
spring.datasource.name=devdb
spring.datasource.initialization-mode=always

## Lightweight connection pool for development
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=2
#spring.datasource.data=\
#  classpath:sqldata/RegionData.sql

spring.h2.console.enabled=true

#update table schema automatically if changes detected, preserves existing data
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.hbm2ddl.import_files=\
  sqldata/RoleData.sql, \
  sqldata/RegionData.sql, \
  sqldata/ProvinceData.sql,\
  sqldata/DistrictData.sql, \
  sqldata/SubDistrictData.sql

# API key for Pi controller services
apikey_for_device=${SSK_APIKEY_FOR_DEVICE}

# API key for TTSM allowing Lock/Unlock, Check cabinet status, ...
apikey_for_ttsm=${SSK_APIKEY_FOR_TTSM}

# TTSM config
apikey_by_ttsm=${SSK_APIKEY_BY_TTSM}
ttsm_ip=http://10.138.32.103
ttsm_port=8180
ttsm_endpoint_update_master=TTSWebService/rest/ttsWs/updateMasterSmartSite
ttsm_endpoint_update_emerg_key=TTSWebService/rest/ttsWs/updateMasterSmartSiteEmergency
ttsm_endpoint_check_onsite=TTSWebService/rest/ttsWs/getJobTTOnSiteBySite

# LDAP config
app.ldap_endpoint=http://dev-ldapservicews.ais.co.th/Authenticate/AuthenticateService.asmx
app.ldap_projectcode=TSMTSITEAUTH
app.ldap_skip=yes

# CSMS config
app.alarm_ip=192.168.159.129
app.alarm_port=48059
app.alarm_filename=alarm_file
# Path for storing alarm files for CFMS
app.alarm_file_path=C:\\img_upload

# Path for storing image snapshots captured by camera
app.img_snapshot_path=C:\\img_upload

## MyHome Cache Configuration for Development
# Cache TTL in minutes (shorter for dev)
app.myhome.cache.ttl.minutes=2
# Maximum cache entries
app.myhome.cache.max.size=500
# Cache cleanup interval in minutes
app.myhome.cache.cleanup.interval.minutes=2

app.site_scheduler=yes

spring.jpa.show-sql=false

