spring.application.name = Smartsite-Appserver
spring.thymeleaf.cache = false
spring.thymeleaf.enabled=true 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.error.path=/error
server.error.whitelabel.enabled=false

## Spring Profiles
#spring.profiles.active=dev
spring.profiles.active=prod
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB

spring.jackson.serialization.INDENT_OUTPUT=true

#eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
#eureka.instance.preferIpAddress=true

#app.site_monitor_interval_sec=60
app.site_lost_contact_threshold_sec=60
app.gen_emergency_key_threshold_sec=120

spring.ldap.embedded.ldif=classpath:user-server.ldif
spring.ldap.embedded.base-dn=dc=springframework,dc=org
spring.ldap.embedded.port=8389
server.servlet.context-path=/ssws
server.port=8080
server.compression.enabled=true

#logging.level.org.springframework=INFO
logging.level.org.springframework=INFO
logging.level.programmer.bonn.play.springbootlog=INFO
logging.level.root=ERROR
#server.error.include-stacktrace=never

## JWT Properties
app.jwtSecret= ${SSK_JWT_SECRET}
app.jwtExpirationInMs = 604800000
app.jwtSecret_rpi = ${SSK_JWT_SECRET_RPI}
app.jwtExpirationInMs_rpi = 86400000

## Connection pool per node: (nodes x maximumPoolSize) must stay below PostgreSQL max_connections
spring.datasource.hikari.connectionTimeout=5000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.idleTimeout=180000
spring.datasource.hikari.maxLifetime=900000
spring.datasource.hikari.leakDetectionThreshold=30000
spring.datasource.hikari.connectionTestQuery=SELECT 1

## Ping thread pool: each ping task does short DB updates; keep max-size moderate vs the Hikari pool
app.thread.ping.core-size=30
app.thread.ping.max-size=60
app.thread.ping.queue-capacity=500
app.ping.timeout-ms=500

server.undertow.threads.worker=300

## PostgreSQL Configuration for Production
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/smartsite2
spring.datasource.username=${SSK_DB_USERNAME}
spring.datasource.password=${SSK_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=smartsite
#spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.stat=debug

#drop n create table again, good for testing, comment this in production
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.hbm2ddl.import_files=\
  sqldata/RoleData.sql, \
  sqldata/RegionData.sql, \
  sqldata/ProvinceData.sql,\
  sqldata/DistrictData.sql, \
  sqldata/SubDistrictData.sql

# API key for Pi controller services
apikey_for_device=${SSK_APIKEY_FOR_DEVICE}

# API key for TTSM allowing Lock/Unlock, Check cabinet status, ...
apikey_for_ttsm=${SSK_APIKEY_FOR_TTSM}

# TTSM config
apikey_by_ttsm=${SSK_APIKEY_BY_TTSM}
ttsm_ip=http://10.138.32.103
ttsm_port=8180
ttsm_endpoint_update_master=TTSWebService/rest/ttsWs/updateMasterSmartSite
ttsm_endpoint_update_emerg_key=TTSWebService/rest/ttsWs/updateMasterSmartSiteEmergency
ttsm_endpoint_check_onsite=TTSWebService/rest/ttsWs/getJobTTOnSiteBySite

# LDAP config
app.ldap_endpoint=https://dev-ldapws.intra.ais/Authenticate/AuthenticateService.asmx
app.ldap_projectcode=TSMTSITEAUTH
app.ldap_skip=yes

# CSMS config
app.alarm_ip=10.232.143.63
app.alarm_port=48059
app.alarm_filename=alarm_file
# Path for storing alarm files for CFMS
app.alarm_file_path=/img_upload
app.my_ip=10.242.15.22
app.alarm_postfix=

# Path for storing image snapshots captured by camera
app.img_snapshot_path=/img_upload

## MyHome Cache Configuration for Production
# Cache TTL in minutes (default: 5 minutes)
app.myhome.cache.ttl.minutes=5
# Maximum cache entries (default: 1000)  
app.myhome.cache.max.size=1000
# Cache cleanup interval in minutes (default: 5 minutes)
app.myhome.cache.cleanup.interval.minutes=5

app.site_scheduler=yes

app.offline_check=yes
app.online_check=yes
app.site_status_corn=0 25 17 * * *
app.offline_check_corn=0 32 17 * * *
app.online_check_corn=0 39 17 * * *

# Daily report ping & healthcheck (กระจายทุก node)
app.ping_enabled=yes
app.health_check_enabled=yes
app.health_check_corn=0 46 17 * * *

# Node identification for distributed processing
app.node.id=1
app.node.total=8
app.distribution.strategy=hash_based