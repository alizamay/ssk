spring.application.name = Smartsite-Appserver
spring.thymeleaf.cache = false
spring.thymeleaf.enabled=true 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.error.path=/error
server.error.whitelabel.enabled=false

## Spring Profiles
spring.config.location=file:${jboss.server.config.dir}/
#spring.profiles.active=dev
spring.profiles.active=prod
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB

spring.jackson.serialization.INDENT_OUTPUT=true

#eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
#eureka.instance.preferIpAddress=true

#app.site_monitor_interval_sec=60
app.site_lost_contact_threshold_sec=60
app.gen_emergency_key_threshold_sec=120

spring.ldap.embedded.ldif=classpath:user-server.ldif
spring.ldap.embedded.base-dn=dc=springframework,dc=org
spring.ldap.embedded.port=8389
server.servlet.context-path=/ssws
server.port=8080
server.compression.enabled=true

#logging.level.org.springframework=INFO
logging.level.org.springframework=WARN
logging.level.programmer.bonn.play.springbootlog=WARN
logging.level.root=ERROR
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.dev.niceone.smartsiteappserver.service.SiteService=WARN
java.util.logging.manager=org.apache.logging.log4j.jul.LogManager
#server.error.include-stacktrace=never

## JWT Properties
app.jwtSecret= ${SSK_JWT_SECRET}
app.jwtExpirationInMs = 604800000
app.jwtSecret_rpi = ${SSK_JWT_SECRET_RPI}
app.jwtExpirationInMs_rpi = 86400000

## PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/smartsite2
spring.datasource.username=${SSK_DB_USERNAME}
spring.datasource.password=${SSK_DB_PASSWORD}


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=smartsite
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

## Connection Pool - Optimized for High Performance
## Pool size is per node: (nodes x maximumPoolSize) must stay below PostgreSQL max_connections.
## Pool exhaustion in prod was caused by OOM/GC stalls and open-in-view, not by pool size.
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.leakDetectionThreshold=60000
spring.datasource.hikari.pool-name=SmartSiteHikariCP
spring.datasource.hikari.registerMbeans=true

# Transaction และ Performance settings
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.current_session_context_class=thread
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

## Thread Pool Configuration (High-Throughput)
# Main async executor - increased for 50K RPS
spring.task.execution.pool.core-size=32
spring.task.execution.pool.max-size=128
spring.task.execution.pool.queue-capacity=10000
spring.task.execution.pool.keep-alive=30s
spring.task.execution.thread-name-prefix=async-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s

# Scheduling thread pool
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=scheduler-

# Tomcat tuning for high throughput
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1000
server.tomcat.max-connections=20000
server.tomcat.connection-timeout=5000

# Custom thread pools
app.thread.prove-offline.core-size=6
app.thread.prove-offline.max-size=12
app.thread.prove-offline.queue-capacity=50
app.thread.batch-processing.core-size=4
app.thread.batch-processing.max-size=8
app.thread.batch-processing.queue-capacity=100
## Ping thread pool: each ping task does short DB updates; keep max-size moderate vs the Hikari pool
## เพื่อเหลือ connection ให้ API requests + scheduler อื่นๆ
app.thread.ping.core-size=30
app.thread.ping.max-size=60
app.thread.ping.queue-capacity=500
app.ping.timeout-ms=500


## Database configuration - moved to profile-specific files
# PostgreSQL for prod, H2 for dev

# API key for Pi controller services
apikey_for_device=${SSK_APIKEY_FOR_DEVICE}

# Device reboot config — Pi via SSH key, Android via ADB (ProcessBuilder)
device.ssh.command=ssh
device.ssh.user=pi
# Private key for user "pi". Empty = the default keys (~/.ssh) of the user running the app server.
# When set, the file must exist and be readable by that user or the reboot fails fast with "SSH key not found".
device.ssh.key=
# ServerAlive* ends the session a few seconds after the Pi goes down for reboot
device.ssh.options=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes -o ServerAliveInterval=2 -o ServerAliveCountMax=2
device.ssh.reboot-command=sudo reboot
device.adb.path=/app/platform-tools/adb
device.adb.port=5555
device.reboot.timeout-sec=15

# API key for TTSM allowing Lock/Unlock, Check cabinet status, ...
apikey_for_ttsm=${SSK_APIKEY_FOR_TTSM}

# TTSM config
apikey_by_ttsm=${SSK_APIKEY_BY_TTSM}
ttsm_ip=http://10.138.32.103
ttsm_port=8180
ttsm_endpoint_update_master=TTSWebService/rest/ttsWs/updateMasterSmartSite
ttsm_endpoint_update_emerg_key=TTSWebService/rest/ttsWs/updateMasterSmartSiteEmergency
ttsm_endpoint_check_onsite=TTSWebService/rest/ttsWs/getJobTTOnSiteBySite

# LDAP config
app.ldap_endpoint=https://dev-ldapws.intra.ais/Authenticate/AuthenticateService.asmx
app.ldap_projectcode=TSMTSITEAUTH
app.ldap_skip=yes

# CSMS config
app.alarm_ip=192.168.159.129
app.alarm_port=48059
app.alarm_filename=alarm_file
# Path for storing alarm files for CFMS
app.alarm_file_path=/img_upload
app.my_ip=10.242.15.22
app.alarm_postfix=

# Path for storing image snapshots captured by camera
app.img_snapshot_path=/img_upload

app.site_scheduler=yes

app.offline_check=yes
app.online_check=yes
app.site_status_corn=0 50 22 * * *
app.offline_check_corn=0 55 22 * * *
app.online_check_corn=0 59 22 * * *

# Daily report ping & healthcheck (กระจายทุก node)
app.ping_enabled=yes
app.health_check_enabled=yes
app.health_check_corn=0 59 23 * * *

# Node identification for distributed processing
app.node.id=1
app.node.total=8

# Site distribution strategy
app.distribution.strategy=hash_based
app.distribution.batch.size=50